services:
  postgres:
    image: postgres:15-alpine
    container_name: icd-autocoder-postgres
    environment:
      - POSTGRES_USER=icd_user
      - POSTGRES_PASSWORD=icd_password
      - POSTGRES_DB=icd_graph
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - icd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icd_user -d icd_graph"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - http_proxy=
        - https_proxy=
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - no_proxy=*
    container_name: icd-autocoder-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./MODELS:/app/models
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://icd_user:icd_password@postgres:5432/icd_graph
      - GRAPH_DB_TYPE=json
      - ALI_API_KEY=${ALI_API_KEY:-}
      - ALI_BASE_URL=${ALI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - HTTP_PROXY=http://172.18.0.1:7890
      - HTTPS_PROXY=http://172.18.0.1:7890
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - icd-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: icd-autocoder-frontend
    ports:
      - "8080:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - icd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  icd-network:
    driver: bridge
    name: icd-network

